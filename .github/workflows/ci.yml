name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: Lint, types, unit, build, E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run build
        env:
          DATA_MODE: demo
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          DATA_MODE: demo
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  database:
    name: Migrations, RLS and stock tests (pgTAP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase db start
      - run: supabase db reset --local
      - run: supabase test db
      - name: Generated types are up to date
        run: |
          supabase gen types typescript --local > /tmp/database.ts
          if [ -f types/database.ts ]; then diff -q types/database.ts /tmp/database.ts || (echo "types/database.ts is stale: run npm run db:types" && exit 1); fi
